name: Pre-commit Checks

permissions:
  contents: read
  actions: write

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "config/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "config/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"

jobs:
  pre-commit:
    name: Pre-commit Hook Validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Cache pre-commit
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit on all files
      run: uv run pre-commit run --all-files --show-diff-on-failure

    - name: Run commit-msg hooks against PR commits
      # PR #90 review N2: pre-commit run --all-files only fires hooks
      # in the ``pre-commit`` stage by default, so the
      # ``no-ai-attribution`` hook (stage: commit-msg) was silently
      # skipped in CI. Replay every commit in the PR's history through
      # the commit-msg stage so AI attribution slips do not reach
      # ``main`` unreviewed.
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -e
        git fetch --depth=1 origin "$BASE_SHA"
        for sha in $(git rev-list "$BASE_SHA"..HEAD); do
          msg_file=$(mktemp)
          git log -1 --format=%B "$sha" > "$msg_file"
          uv run pre-commit run --hook-stage commit-msg --commit-msg-filename "$msg_file"
          rm -f "$msg_file"
        done

    - name: Minimize uv cache
      run: uv cache prune --ci
