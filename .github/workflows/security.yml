name: Security Scanning

permissions:
  contents: read
  actions: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "examples/json/**/*.json"
      - "config/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/security.yml"
  pull_request:
    types: [opened, synchronize]
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "tests/**/*.py"
      - "examples/json/**/*.json"
      - "config/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/security.yml"

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          # Using uv for consistency
          uv sync --dev

      - name: Run Bandit (Security Linter)
        run: |
          uv run bandit -r src/ -f json -o bandit-report.json --exit-zero
          uv run bandit -r src/ -ll --exit-zero

      - name: Run pip-audit (Dependency Scanner)
        run: |
          uvx pip-audit --format json --output pip-audit-report.json || true
          uvx pip-audit

      - name: SQL Injection Pattern Check
        run: |
          if grep -rn "Execute Sql String.*\${" src/ --include="*.py"; then
            echo "ERROR: Potential SQL injection vulnerability detected"
            exit 1
          fi

      - name: Credential Leak Check
        run: |
          if grep -rEn "(password|secret|api_key)\s*=\s*['\"][^'\"]{8,}" src/ --include="*.py"; then
            echo "WARNING: Potential hardcoded credential detected"
            exit 1
          fi

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
